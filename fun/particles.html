<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Playground — canvas physics toy | Harshit Thakur</title>
<meta name="description" content="A canvas physics toy — your cursor spawns particles, gravity toggles, colors drift. A fun mini-project by Harshit Thakur.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='3' width='34' height='34' rx='8' fill='%23FF6B5E'/%3E%3Ctext x='20' y='27' font-family='Arial, sans-serif' font-weight='800' font-size='15' fill='%230D1128' text-anchor='middle'%3EHT%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0d1128">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1128;
  --surface: rgba(22, 27, 61, 0.82);
  --border: rgba(255,255,255,0.1);
  --border-strong: rgba(255,255,255,0.2);
  --text: #eceeff;
  --text-dim: #8891c9;
  --accent: #ff6b5e;
  --accent-soft: rgba(255,107,94,0.15);
  --on-accent: #2a0e09;
  --display: 'Space Grotesk', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  overflow: hidden;
  touch-action: none;
}

canvas { display:block; position: fixed; inset: 0; }

/* top bar */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.logo { display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:17px; color:var(--text); text-decoration:none; }
.logo span.title { text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.back-link {
  font-size: 12.5px; color: var(--text-dim); text-decoration:none;
  background: var(--surface); border:1px solid var(--border); border-radius: 20px;
  padding: 7px 16px; backdrop-filter: blur(8px);
  transition: color 0.15s ease, border-color 0.15s ease;
}
.back-link:hover { color: var(--accent); border-color: var(--accent); }

/* stats */
.stats {
  position: fixed; top: 64px; right: 20px; z-index: 10;
  font-size: 11.5px; color: var(--text-dim); text-align: right;
  background: var(--surface); border:1px solid var(--border); border-radius: 10px;
  padding: 8px 14px; backdrop-filter: blur(8px);
  line-height: 1.7;
}
.stats b { color: var(--accent); font-weight: 700; }

/* hint */
.hint {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 5; text-align: center; pointer-events: none;
  transition: opacity 0.8s ease;
}
.hint h1 { font-family: var(--display); font-size: clamp(24px,4vw,38px); font-weight:800; letter-spacing:-0.02em; margin-bottom:10px; text-shadow: 0 4px 24px rgba(0,0,0,0.7); }
.hint p { color: var(--text-dim); font-size: 13.5px; }
.hint.hide { opacity: 0; }

/* control dock */
.dock {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 10px 12px; backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  max-width: calc(100vw - 24px);
}
.dock .sep { width:1px; background: var(--border); margin: 4px 2px; }
.ctl {
  font-family: var(--mono); font-size: 12.5px;
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 14px; cursor: pointer; white-space: nowrap;
  transition: all 0.15s ease;
}
.ctl:hover { color: var(--text); border-color: var(--border-strong); }
.ctl.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.ctl kbd {
  font-size: 10px; opacity: 0.55; margin-left: 6px;
  border: 1px solid currentColor; border-radius: 4px; padding: 0 4px;
}

@media (max-width: 640px) {
  .ctl kbd { display: none; }
  .ctl { font-size: 12px; padding: 8px 11px; }
  .stats { top: auto; bottom: 84px; right: 12px; }
  .hint p.desktop-only { display: none; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<header class="topbar">
  <a href="../index.html" class="logo">
    <svg viewBox="0 0 40 40" width="30" height="30"><rect x="3" y="3" width="34" height="34" rx="9" fill="#ff6b5e" transform="rotate(-4 20 20)"/><text x="20" y="27" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="16" fill="#2a0e09" text-anchor="middle">HT</text></svg>
    <span class="title">Particle Playground</span>
  </a>
  <a href="../index.html#fun" class="back-link">← back to site</a>
</header>

<div class="stats" id="stats">particles <b id="stCount">0</b><br>fps <b id="stFps">60</b></div>

<div class="hint" id="hint">
  <h1>Move your cursor ✨</h1>
  <p>click / tap for a burst · try the modes below</p>
  <p class="desktop-only">keys: 1–4 modes · G gravity · T trails · C clear · space burst</p>
</div>

<div class="dock" id="dock">
  <button class="ctl mode on" data-mode="spray">✨ spray<kbd>1</kbd></button>
  <button class="ctl mode" data-mode="attract">🧲 attract<kbd>2</kbd></button>
  <button class="ctl mode" data-mode="repel">💨 repel<kbd>3</kbd></button>
  <button class="ctl mode" data-mode="vortex">🌀 vortex<kbd>4</kbd></button>
  <div class="sep"></div>
  <button class="ctl" id="gravBtn">⬇ gravity<kbd>G</kbd></button>
  <button class="ctl on" id="trailBtn">☄ trails<kbd>T</kbd></button>
  <button class="ctl" id="clearBtn">🧹 clear<kbd>C</kbd></button>
</div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

/* ---------- state ---------- */
const MAX = 900;
const particles = [];
let mode = 'spray';
let gravity = false;
let trails = true;
let hue = 8;                 // starts near the site's coral accent
let pointer = { x: W/2, y: H/2, px: W/2, py: H/2, down: false, active: false };
let interacted = false;

/* ---------- particle ---------- */
function spawn(x, y, vx, vy, boost){
  if (particles.length >= MAX) particles.splice(0, particles.length - MAX + 1);
  const a = Math.random() * Math.PI * 2;
  const s = Math.random() * (boost ? 5 : 1.6);
  particles.push({
    x, y,
    vx: vx + Math.cos(a) * s,
    vy: vy + Math.sin(a) * s,
    size: 1.5 + Math.random() * 2.8,
    life: 1,
    decay: 0.003 + Math.random() * 0.006,
    hue: hue + (Math.random() * 40 - 20)
  });
}

function burst(x, y, n){
  for (let i = 0; i < n; i++) spawn(x, y, 0, 0, true);
}

/* ---------- input ---------- */
function onMove(x, y){
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = x; pointer.y = y;
  pointer.active = true;
  hideHint();
  if (mode === 'spray' || pointer.down) {
    const dx = x - pointer.px, dy = y - pointer.py;
    const speed = Math.min(Math.hypot(dx, dy), 40);
    const n = 1 + Math.floor(speed / 6);
    for (let i = 0; i < n; i++) {
      const t = i / n;
      spawn(pointer.px + dx * t, pointer.py + dy * t, dx * 0.08, dy * 0.08, false);
    }
  }
}

canvas.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
canvas.addEventListener('pointerdown', e => {
  pointer.down = true;
  onMove(e.clientX, e.clientY);
  burst(e.clientX, e.clientY, 44);
});
window.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointerleave', () => { pointer.active = false; });

function hideHint(){
  if (interacted) return;
  interacted = true;
  document.getElementById('hint').classList.add('hide');
}

/* ---------- controls ---------- */
const modeBtns = [...document.querySelectorAll('.mode')];
function setMode(m){
  mode = m;
  modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === m));
}
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

const gravBtn = document.getElementById('gravBtn');
const trailBtn = document.getElementById('trailBtn');
function toggleGravity(){ gravity = !gravity; gravBtn.classList.toggle('on', gravity); }
function toggleTrails(){ trails = !trails; trailBtn.classList.toggle('on', trails); }
function clearAll(){ particles.length = 0; }

gravBtn.addEventListener('click', toggleGravity);
trailBtn.addEventListener('click', toggleTrails);
document.getElementById('clearBtn').addEventListener('click', clearAll);

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'g') toggleGravity();
  else if (k === 't') toggleTrails();
  else if (k === 'c') clearAll();
  else if (k === '1') setMode('spray');
  else if (k === '2') setMode('attract');
  else if (k === '3') setMode('repel');
  else if (k === '4') setMode('vortex');
  else if (k === ' ') { e.preventDefault(); hideHint(); burst(W/2, H/2, 80); }
});

/* ---------- ambient drizzle before first interaction ---------- */
let ambientTimer = setInterval(() => {
  if (interacted) { clearInterval(ambientTimer); return; }
  spawn(Math.random() * W, Math.random() * H * 0.5, 0, 0.3, false);
}, 90);

/* ---------- physics + render ---------- */
const G = 0.14;
const FLOOR_BOUNCE = -0.62;
let frames = 0, lastFpsAt = performance.now();
const stCount = document.getElementById('stCount');
const stFps = document.getElementById('stFps');

function step(){
  // background / trails
  if (trails) {
    ctx.fillStyle = 'rgba(13, 17, 40, 0.16)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#0d1128';
    ctx.fillRect(0, 0, W, H);
  }

  hue = (hue + 0.25) % 360;

  const px = pointer.x, py = pointer.y;
  const usePointer = pointer.active && mode !== 'spray';

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (usePointer) {
      const dx = px - p.x, dy = py - p.y;
      const d2 = dx * dx + dy * dy + 60;
      const d = Math.sqrt(d2);
      const f = 900 / d2;
      if (mode === 'attract') {
        p.vx += (dx / d) * f * 2.2;
        p.vy += (dy / d) * f * 2.2;
      } else if (mode === 'repel') {
        p.vx -= (dx / d) * f * 2.6;
        p.vy -= (dy / d) * f * 2.6;
      } else if (mode === 'vortex') {
        p.vx += ((dx / d) * f * 0.8) + ((-dy / d) * f * 2.4);
        p.vy += ((dy / d) * f * 0.8) + (( dx / d) * f * 2.4);
      }
    }

    if (gravity) {
      p.vy += G;
    } else {
      p.vx *= 0.985; p.vy *= 0.985;   // gentle drift
    }

    p.x += p.vx; p.y += p.vy;

    // walls
    if (gravity) {
      if (p.y > H - p.size) { p.y = H - p.size; p.vy *= FLOOR_BOUNCE; p.vx *= 0.92; }
      if (p.x < p.size) { p.x = p.size; p.vx *= -0.7; }
      if (p.x > W - p.size) { p.x = W - p.size; p.vx *= -0.7; }
    } else {
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
    }

    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    const v = Math.min(Math.hypot(p.vx, p.vy) * 6, 40);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + (p.hue + v) + ', 90%, ' + (60 + v * 0.5) + '%, ' + (p.life * 0.9) + ')';
    ctx.fill();
  }

  // fps + count
  frames++;
  const now = performance.now();
  if (now - lastFpsAt >= 500) {
    stFps.textContent = Math.round(frames * 1000 / (now - lastFpsAt));
    stCount.textContent = particles.length;
    frames = 0; lastFpsAt = now;
  }

  requestAnimationFrame(step);
}

ctx.fillStyle = '#0d1128';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(step);

})();
</script>
</body>
</html>
